[build]
  base = "client"
  command = "npm install && npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Apex -> www is canonical. `force = true` makes the Netlify edge answer the 301
# itself instead of forwarding the request to the Next.js function first (Lighthouse
# measured that hop at ~800 ms on mobile). The primary-domain setting in the Netlify
# UI should also point at www.mobisoins.com so both agree.
[[redirects]]
  from = "https://mobisoins.com/*"
  to = "https://www.mobisoins.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "index, follow"

# Hero video loops forever: without this every loop re-validates the file with
# the server (max-age=0), which hitches on mobile networks. If a clip is ever
# replaced, give it a new filename.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"
